
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Keerti Das: My Flask Website{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Shared Navigation Bar for the Contact and Favorite Course pages-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">Keerti Das: My Flask Website</a>

            <div class="navbar-nav">
                <a class="nav-link"
                   href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">
                    Favorite Course
                </a>

                <a class="nav-link" href="/contact">
                    Contact
                </a>
            </div>
        </div>
    </nav>

    <!-- Page Content -->
    <div class="container mt-5 mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Shared Footer for both pages-->
    <footer class="text-center text-muted py-4">
        <p>Keerti Das: My Flask Website | Flask Assignment</p>
    </footer>

    <!-- Bootstrap JavaScript for intractive features, Flask handles form submissions-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
